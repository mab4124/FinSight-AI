# Alembic configuration file.
# This file is used by alembic CLI to manage database migrations.

[alembic]
# Path to migration scripts
script_location = migrations

# Template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone to use when rendering the date within the migration file
# Leave blank for UTC default
# timezone = UTC

# Max length of characters to apply to the "slug" field
truncate_slug_length = 40

# True to indicate that alembic should error out when irreversible operations
# (like dropping a column) are attempted
# drop_constraint = false

# Database URL is read from the environment variable DATABASE_URL_SYNC.
# Note: Alembic requires a synchronous driver (psycopg2), not asyncpg.
# The async engine used by FastAPI is separate.
sqlalchemy.url = postgresql+psycopg2://postgres:postgres@localhost:5432/fintel

[post_write_hooks]
# Uncomment to auto-format migration files with ruff after generation:
# hooks = ruff
# ruff.type = exec
# ruff.executable = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
